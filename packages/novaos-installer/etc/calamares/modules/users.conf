---
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - name: users
      must_exist: true
      system: true
    - name: sudo
      must_exist: true
      system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, nova, admin ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-${product}"
    forbidden_names: [ localhost ]
