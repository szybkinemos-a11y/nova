---
# UEFI + GPT: partycja systemowa EFI
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
efiSystemPartition: "/boot/efi"

# Swap: NovaOS używa zram, plik wymiany opcjonalnie
userSwapChoices: [ none, file ]
initialSwapChoice: none
swapPartitionName: "swap"

# Nic nie jest zaznaczone domyślnie – użytkownik musi świadomie wybrać,
# czy wymazać dysk, zainstalować obok innego systemu, czy partycjonować ręcznie.
initialPartitioningChoice: none
allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true
showNotEncryptedBootMessage: false

defaultPartitionTableType: gpt
requiredPartitionTableType: [ gpt, msdos ]
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
luksGeneration: luks2
enableLuksAutomatedPartitioning: true

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: ext4
      options: [ defaults, noatime ]
