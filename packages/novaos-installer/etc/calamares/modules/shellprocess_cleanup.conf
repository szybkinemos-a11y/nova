---
dontChroot: false
timeout: 600
script:
    # Repozytorium Flathub (gdy jest internet; inaczej zrobi to usługa przy starcie)
    - "-flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"
    - "-systemctl enable novaos-flathub.service"
    # Zapora sieciowa aktywna od pierwszego uruchomienia
    - "-systemctl enable ufw.service"
    # Ślady sesji live
    - "-rm -f /etc/sudoers.d/novaos-live /etc/xdg/autostart/novaos-live-welcome.desktop"
