# NovaOS – menu rozruchowe nośnika live (BIOS i UEFI)
set default=0
set timeout=10
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
insmod font
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    terminal_output gfxterm
fi
if [ -f /boot/grub/themes/novaos/theme.txt ]; then
    loadfont /boot/grub/themes/novaos/inter-regular-14.pf2
    loadfont /boot/grub/themes/novaos/inter-regular-16.pf2
    loadfont /boot/grub/themes/novaos/inter-regular-18.pf2
    loadfont /boot/grub/themes/novaos/inter-bold-18.pf2
    loadfont /boot/grub/themes/novaos/inter-bold-32.pf2
    set theme=/boot/grub/themes/novaos/theme.txt
    export theme
fi

menuentry "Uruchom NovaOS  (wypróbuj lub zainstaluj)" --class novaos {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper locale=@DEFAULT_LOCALE@ keyboard-configuration/layoutcode=@DEFAULT_KEYMAP@ quiet splash ---
    initrd  /casper/initrd
}
menuentry "Start NovaOS  (English)" --class novaos {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper locale=en_US.UTF-8 keyboard-configuration/layoutcode=us quiet splash ---
    initrd  /casper/initrd
}
menuentry "Uruchom NovaOS  (tryb bezpieczny grafiki)" --class novaos {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper locale=@DEFAULT_LOCALE@ nomodeset quiet splash ---
    initrd  /casper/initrd
}
menuentry "Sprawdź nośnik pod kątem błędów" {
    linux   /casper/vmlinuz boot=casper integrity-check quiet splash ---
    initrd  /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "Ustawienia firmware UEFI" { fwsetup }
fi
menuentry "Uruchom ponownie" { reboot }
menuentry "Wyłącz komputer" { halt }
