# =====================================================================
#  NovaOS – główna konfiguracja budowania
#  Wszystkie skrypty w scripts/ czytają ten plik. Możesz nadpisać
#  dowolną wartość zmienną środowiskową, np.:
#     MIRROR=http://pl.archive.ubuntu.com/ubuntu sudo -E ./scripts/build-iso.sh
# =====================================================================

# --- Tożsamość systemu ------------------------------------------------
DISTRO_NAME="${DISTRO_NAME:-NovaOS}"
DISTRO_ID="${DISTRO_ID:-novaos}"
DISTRO_VERSION="${DISTRO_VERSION:-1.0}"
DISTRO_CODENAME="${DISTRO_CODENAME:-aurora}"
DISTRO_PRETTY="${DISTRO_PRETTY:-NovaOS 1.0 Aurora}"
DISTRO_URL="${DISTRO_URL:-https://novaos.example.org}"

# --- Baza Ubuntu ------------------------------------------------------
# 26.04 LTS "Resolute Raccoon" – KDE Plasma 6.6, Qt 6.10, Linux 7.0
UBUNTU_CODENAME="${UBUNTU_CODENAME:-resolute}"
UBUNTU_VERSION="${UBUNTU_VERSION:-26.04}"
ARCH="${ARCH:-amd64}"
MIRROR="${MIRROR:-http://archive.ubuntu.com/ubuntu}"
SECURITY_MIRROR="${SECURITY_MIRROR:-http://security.ubuntu.com/ubuntu}"
COMPONENTS="${COMPONENTS:-main restricted universe multiverse}"

# --- Sesja live -------------------------------------------------------
LIVE_USER="${LIVE_USER:-nova}"
LIVE_HOSTNAME="${LIVE_HOSTNAME:-novaos}"
DEFAULT_LOCALE="${DEFAULT_LOCALE:-pl_PL.UTF-8}"
EXTRA_LOCALES="${EXTRA_LOCALES:-en_US.UTF-8}"
DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Warsaw}"
DEFAULT_KEYMAP="${DEFAULT_KEYMAP:-pl}"

# --- Obraz ISO --------------------------------------------------------
ISO_NAME="${ISO_NAME:-NovaOS.iso}"
ISO_LABEL="${ISO_LABEL:-NOVAOS_1_0}"
# zstd = szybka dekompresja (szybszy live), xz = mniejszy plik
SQUASHFS_COMP="${SQUASHFS_COMP:-zstd}"

# --- Opcje ------------------------------------------------------------
# Instaluj pakiety "Recommends" (bezpieczniej = pełniejszy pulpit)
INSTALL_RECOMMENDS="${INSTALL_RECOMMENDS:-yes}"
# Zaokrąglone rogi wszystkich okien (efekt KWin budowany ze źródeł)
ENABLE_ROUNDED_CORNERS="${ENABLE_ROUNDED_CORNERS:-yes}"
ROUNDED_CORNERS_REPO="${ROUNDED_CORNERS_REPO:-https://github.com/matinlotfali/KDE-Rounded-Corners}"
ROUNDED_CORNERS_REF="${ROUNDED_CORNERS_REF:-master}"
# Repozytorium Flathub włączone domyślnie
ENABLE_FLATHUB="${ENABLE_FLATHUB:-yes}"

# --- Katalogi robocze -------------------------------------------------
PROJECT_DIR="${PROJECT_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
WORK_DIR="${WORK_DIR:-$PROJECT_DIR/work}"
CHROOT_DIR="$WORK_DIR/chroot"
IMAGE_DIR="$WORK_DIR/image"
DEBS_DIR="$WORK_DIR/debs"
STAMP_DIR="$WORK_DIR/.stamps"
OUT_DIR="${OUT_DIR:-$PROJECT_DIR/out}"
